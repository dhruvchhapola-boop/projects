<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Subscription</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero">
        <h3>Coming Soon!</h3>
        <h1>Our Brand New <br>Website is on it's Way!</h1>
        <p>Subscribe for more details.</p>
        <form name="Submit-to-Google-Sheet">
            <input type="email" name="Email" placeholder="Your Email id "required>
            <button type="submit"><img src="send-icon.png " width="30px" ></button>
        </form>
        <span id="msg"></span>
    </div>

    <script>
	const scriptURL = 'https://script.google.com/macros/s/AKfycbx-86iaYCdEka7jXTVrqtmV7AKFxY2d6o9vBanhw8tijovk-FjjO8_ek7aDslLkOvbr8Q/exec'
	const form = document.forms['Submit-to-Google-Sheet']
    const msg = document.getElementById("msg") 

	form.addEventListener('submit', e => {
		e.preventDefault()
		fetch(scriptURL, { method: 'POST', body: new FormData(form) })
			.then(response => {
                msg.innerHTML = "Thank you for subscribing!"
                setTimeout(function(){
                    msg.innerHTML = ""
                }, 5000)
                form.reset()
            })
			.catch(error => console.error('Error!', error.message))
	})
</script>
</body>
</html>

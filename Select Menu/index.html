<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Menu </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

            <div class="hero">
                <div class="selector">
                <div id="selectField">
                    <div class="selected">
                        <img class="selected-icon" src="" alt="Selected icon" hidden>
                        <p>Select Social Media</p>
                    </div>
                    <img class="arrow" src="arrow.png" alt="Open dropdown">
                </div>
                <ul id="list">
                    <li class="options"><img src="facebook.png" alt="Facebook">
                        <p>Facebook</p>
                    </li>
                    <li class="options"><img src="twitter.png" alt="Twitter">
                        <p>Twitter</p>
                    </li>
                    <li class="options"><img src="instagram.png" alt="Instagram">
                        <p>Instagram</p>
                    </li> 
                    <li class="options"><img src="youtube.png" alt="YouTube">
                        <p>YouTube</p>
                    </li> 
                    <li class="options"><img src="whatsapp.png" alt="WhatsApp">
                        <p>WhatsApp</p>
                    </li> 
                    <li class="options"><img src="pinterest.png" alt="Pinterest">
                        <p>Pinterest</p>
                    </li> 
                </ul>
                </div>
            </div>
            <script src="script.js"></script>
</body>
</html>
